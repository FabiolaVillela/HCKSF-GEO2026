<div id="dome-interactive">
<h3>Domo · fuerzas y reacciones</h3>
<div class="text-small text-muted">Acero · HSS Ø4″ × 1/8″ · peso propio · análisis lineal</div>
<div class="viz-controls">
<label class="form-label">Mostrar<select class="form-select" id="di-mode"><option value="axial">Fuerzas axiales</option><option value="reactions">Reacciones en apoyos</option><option value="geometry">Geometría</option></select></label>
<label class="form-label">Zoom <span id="di-zoom-value">100%</span><input class="form-range" id="di-zoom" type="range" min="40" max="800" value="100"></label>
</div>
<canvas id="di-canvas" role="img" aria-label="Domo tridimensional: arrastrar para girar, rueda o pellizco para zoom, clic en barra o apoyo para seleccionar" style="width:100%;height:440px;display:block;touch-action:none;cursor:grab"></canvas>
<div class="text-small text-muted">Arrastra para girar · rueda / pellizco para zoom · Mayús + arrastre para desplazar</div>
<div id="di-legend" class="viz-row text-small"></div>
<div class="viz-controls"><label class="form-label">Seleccionar barra o apoyo<select class="form-select" id="di-pick"><option value="">Sin selección</option></select></label></div>
<div id="di-detail" class="card" aria-live="polite">Selecciona una barra o un apoyo.</div>
<div class="text-small text-muted">Axial: + tracción, − compresión · reacciones en ejes globales X, Y, Z · geometría sin deformar</div>
<script type="application/json" id="di-data">__DOME_DATA__</script>
</div>
<script>
(()=>{
const root=document.getElementById('dome-interactive'),D=JSON.parse(root.querySelector('#di-data').textContent),canvas=root.querySelector('#di-canvas'),ctx=canvas.getContext('2d'),mode=root.querySelector('#di-mode'),zoom=root.querySelector('#di-zoom'),pick=root.querySelector('#di-pick'),detail=root.querySelector('#di-detail'),legend=root.querySelector('#di-legend');
let q=[.87,.35,.12,.32],pan=[0,0],selected='',segments=[],points=[],supports=[],dragged=false;
const pointers=new Map();let pinch=null;
const fmt=(x,n=3)=>x.toLocaleString('es-MX',{maximumFractionDigits:n,minimumFractionDigits:n});
function normalize(a){const l=Math.hypot(...a);return a.map(v=>v/l);}
q=normalize(q);
function mul(a,b){return [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];}
function rotate(p){const r=mul(mul(q,[0,...p]),[q[0],-q[1],-q[2],-q[3]]);return r.slice(1);}
for(let i=0;i<D.bars.length;i++){const o=document.createElement('option');o.value='b'+i;o.textContent='Barra '+i;pick.append(o);}
for(let i=0;i<D.nodes.length;i++)if(D.nodes[i].s){const o=document.createElement('option');o.value='s'+i;o.textContent='Apoyo · nodo '+i;pick.append(o);}
function restore(s){if(['axial','reactions','geometry'].includes(s?.modelContent?.resultado))mode.value=s.modelContent.resultado;const v=s?.privateContent;if(v){if(Array.isArray(v.q)&&v.q.length===4&&v.q.every(Number.isFinite)&&Math.hypot(...v.q)>0)q=normalize(v.q);zoom.value=v.zoom??100;if(Array.isArray(v.pan)&&v.pan.length===2&&v.pan.every(Number.isFinite))pan=v.pan;}
const sel=s?.modelContent?.seleccion;if(typeof sel==='string'&&Array.from(pick.options).some(o=>o.value===sel))selected=sel;pick.value=selected;}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{resultado:mode.value,seleccion:selected},privateContent:{q,pan,zoom:+zoom.value}}).catch(()=>{});}
restore(window.openai?.widgetState);
function updateDetail(){
detail.replaceChildren();if(!selected){detail.textContent='Selecciona una barra o un apoyo.';return;}
const id=+selected.slice(1),bar=selected[0]==='b';const title=document.createElement('div');title.textContent=bar?`Barra ${id} · nodos ${D.bars[id].i} → ${D.bars[id].j}`:`Apoyo articulado · nodo ${id}`;detail.append(title);
const table=document.createElement('table');table.className='table table-sm tabular-nums';const body=document.createElement('tbody');table.append(body);
const row=(a,b)=>{const tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.scope='row';th.textContent=a;td.className='text-end';td.textContent=b;tr.append(th,td);body.append(tr);};
if(bar){const e=D.bars[id];row('Capa',e.layer);row('Longitud',fmt(e.l)+' m');row('Axial en i',fmt(e.n[0])+' kN');row('Axial al centro',fmt(e.n[1])+' kN');row('Axial en j',fmt(e.n[2])+' kN');row('Estado',e.n.every(n=>n>=0)?'Tracción':e.n.every(n=>n<=0)?'Compresión':'Cambio de signo');
for(const n of [e.i,e.j])if(D.nodes[n].s){const r=D.nodes[n].r;row('Reacción apoyo '+n+' · Rx / Ry / Rz',r.slice(0,3).map(v=>fmt(v)).join(' / ')+' kN');}
}else{const n=D.nodes[id];row('Coordenadas X / Y / Z',n.p.map(v=>fmt(v)).join(' / ')+' m');['Rx','Ry','Rz'].forEach((label,i)=>row(label,fmt(n.r[i])+' kN'));row('Resultante',fmt(Math.hypot(...n.r.slice(0,3)))+' kN');row('Mx / My / Mz',n.r.slice(3).map(v=>fmt(v,6)).join(' / ')+' kN·m');row('Restricciones','Ux, Uy, Uz; giros libres');}
detail.append(table);
}
function draw(){
const width=canvas.clientWidth,height=440,dpr=window.devicePixelRatio||1;canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
const styles=getComputedStyle(root);const color=k=>styles.getPropertyValue(k).trim();const fg=color('--foreground'),muted=color('--muted-foreground'),active=color('--viz-series-1'),second=color('--viz-series-2');
// Browser resolves theme color functions before they reach the canvas.
const probe=document.createElement('span');probe.hidden=true;root.append(probe);const resolve=c=>{probe.style.color=c;return getComputedStyle(probe).color;};const colors=[fg,muted,active,second].map(resolve);probe.remove();
const scale=Math.min((width-32)/51,(height-45)/51)*(+zoom.value/100);
function project(p){const r=rotate([p[0],p[1],p[2]-7.5578]);return [width/2+pan[0]+r[0]*scale,height/2+pan[1]-r[1]*scale,r[2]];}
points=D.nodes.map(n=>project(n.p));supports=[];segments=D.bars.map((e,i)=>({e,i,a:points[e.i],b:points[e.j]})).sort((a,b)=>(a.a[2]+a.b[2])-(b.a[2]+b.b[2]));
for(const {e,i,a,b} of segments){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineWidth=selected==='b'+i?3:1.3;ctx.globalAlpha=selected==='b'+i?1:mode.value==='reactions'?.32:.8;ctx.strokeStyle=selected==='b'+i?colors[0]:mode.value==='axial'?(e.n[1]<0?colors[3]:colors[2]):colors[1];ctx.stroke();}
ctx.globalAlpha=1;
for(let i=0;i<D.nodes.length;i++)if(D.nodes[i].s){const p=points[i];supports.push({i,p});ctx.lineWidth=selected==='s'+i?3:1.3;ctx.strokeStyle=selected==='s'+i?colors[0]:colors[2];ctx.beginPath();ctx.moveTo(p[0],p[1]-3);ctx.lineTo(p[0]-6,p[1]+7);ctx.lineTo(p[0]+6,p[1]+7);ctx.closePath();ctx.stroke();
if(mode.value==='reactions'){const r=D.nodes[i].r;const length=4/Math.max(...D.nodes.filter(n=>n.s).map(n=>Math.hypot(...n.r.slice(0,3))));const tip=project(D.nodes[i].p.map((v,j)=>v+r[j]*length));ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(tip[0],tip[1]);const angle=Math.atan2(tip[1]-p[1],tip[0]-p[0]);ctx.lineTo(tip[0]-6*Math.cos(angle-.45),tip[1]-6*Math.sin(angle-.45));ctx.moveTo(tip[0],tip[1]);ctx.lineTo(tip[0]-6*Math.cos(angle+.45),tip[1]-6*Math.sin(angle+.45));ctx.stroke();}}
ctx.fillStyle=colors[0];ctx.font='12px sans-serif';if(selected){const id=+selected.slice(1),e=selected[0]==='b'?D.bars[id]:null,p=e?points[e.i].map((v,j)=>(v+points[e.j][j])/2):points[id];const text=e?`Barra ${id} · N ${fmt(e.n[1])} kN`:`Apoyo ${id} · Rz ${fmt(D.nodes[id].r[2])} kN`;const tx=Math.max(8,Math.min(width-ctx.measureText(text).width-8,p[0]+10)),ty=Math.max(16,Math.min(height-12,p[1]-12));ctx.fillText(text,tx,ty);}
// Global axis triad follows the same camera orientation.
for(const [axis,label] of [[[1,0,0],'X'],[[0,1,0],'Y'],[[0,0,1],'Z']]){const v=rotate(axis),x=30+v[0]*23,y=height-35-v[1]*23;ctx.strokeStyle=colors[1];ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(30,height-35);ctx.lineTo(x,y);ctx.stroke();ctx.fillText(label,x+3,y-3);}
root.querySelector('#di-zoom-value').textContent=zoom.value+'%';legend.replaceChildren();const add=(label,c)=>{const s=document.createElement('span'),mark=document.createElement('span');mark.textContent='━ ';mark.style.color=c;s.append(mark,document.createTextNode(label));legend.append(s);};
if(mode.value==='axial'){add('Tracción (+)',colors[2]);add('Compresión (−)',colors[3]);}else if(mode.value==='reactions')add('△ apoyos · flechas de reacción (escala común)',colors[2]);else add('Barras · △ apoyos',colors[1]);
}
function selectAt(x,y){let best=12,value='';for(const {i,p} of supports){const d=Math.hypot(x-p[0],y-p[1]);if(d<best){best=d;value='s'+i;}}
if(!value){best=10;for(const s of segments){const dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1],t=Math.max(0,Math.min(1,((x-s.a[0])*dx+(y-s.a[1])*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(x-s.a[0]-t*dx,y-s.a[1]-t*dy);if(d<best){best=d;value='b'+s.i;}}}selected=value;pick.value=value;updateDetail();draw();save();}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY});if(pointers.size===1)dragged=false;if(pointers.size===2){const a=[...pointers.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom:+zoom.value};dragged=true;}canvas.style.cursor='grabbing';});
canvas.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(Math.hypot(e.clientX-p.startX,e.clientY-p.startY)>4)dragged=true;
if(pointers.size===2&&pinch){const a=[...pointers.values()];zoom.value=Math.max(40,Math.min(800,pinch.zoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/Math.max(1,pinch.d)));}else if(pointers.size===1){if(e.shiftKey){pan[0]+=dx;pan[1]+=dy;}else{const len=Math.hypot(dx,dy);if(len){const t=len*.008/2;q=normalize(mul([Math.cos(t),dy/len*Math.sin(t),dx/len*Math.sin(t),0],q));}}}draw();});
function end(e,cancel){const p=pointers.get(e.pointerId);if(!p)return;const click=!dragged&&pointers.size===1&&!cancel;pointers.delete(e.pointerId);pinch=null;if(!pointers.size){canvas.style.cursor='grab';if(click){const r=canvas.getBoundingClientRect();selectAt(e.clientX-r.left,e.clientY-r.top);}else save();}}
canvas.addEventListener('pointerup',e=>end(e,false));canvas.addEventListener('pointercancel',e=>end(e,true));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom.value=Math.max(40,Math.min(800,+zoom.value*Math.exp(-e.deltaY*.0015)));draw();save();},{passive:false});
zoom.addEventListener('input',()=>{draw();save();});mode.addEventListener('change',()=>{draw();save();});pick.addEventListener('change',()=>{selected=pick.value;updateDetail();draw();save();});new ResizeObserver(draw).observe(canvas);new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);updateDetail();draw();}});updateDetail();draw();
})();
</script>
